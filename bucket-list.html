<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bucket List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/YOUR-FONT-AWESOME-KEY.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bucket-list">
        <h2>🌟 My Bucket List</h2>
        
        <h4>✈️ Travel Goals</h4>
        <ul class="list-group mb-3">
            <li class="list-group-item">Visit Japan <i class="fas fa-check-circle text-success"></i></li>
            <li class="list-group-item">See the Northern Lights <i class="fas fa-star text-warning"></i></li>
            <li class="list-group-item">Go on an African Safari <i class="fas fa-check-circle text-success"></i></li>
        </ul>

        <h4>📚 Learning Goals</h4>
        <ul class="list-group mb-3">
            <li class="list-group-item">Learn a new language <i class="fas fa-graduation-cap text-primary"></i></li>
            <li class="list-group-item">Master Data Science <i class="fas fa-laptop-code text-danger"></i></li>
            <li class="list-group-item">Read 50 books in a year <i class="fas fa-book text-warning"></i></li>
        </ul>

        <h4>🎯 Life Goals</h4>
        <ul class="list-group">
            <li class="list-group-item">Start my own business <i class="fas fa-rocket text-danger"></i></li>
            <li class="list-group-item">Run a marathon <i class="fas fa-running text-success"></i></li>
            <li class="list-group-item">Buy a dream house <i class="fas fa-home text-primary"></i></li>
        </ul>
    </div>
</body>
</html>
